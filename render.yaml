services:
  - type: web
    name: hou-japanese
    runtime: node
    plan: free
    buildCommand: npm install && python3 -m pip install edge-tts==7.2.8 && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: PYTHON_BIN
        value: python3
      - key: SITE_USERNAME
        value: hou
      - key: SITE_PASSWORD
        generateValue: true
